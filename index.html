<style>

button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stage{flex:1;position:relative;min-width:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.dash{position:absolute;inset:0;overflow:auto;padding:18px 14px}.dash>*{max-width:780px;margin-left:auto;margin-right:auto}
.hero{text-align:center}.hero h1{font-size:25px;margin:0;color:var(--acc)}.hero p{margin:4px 0;color:var(--mute)}
h2{font-size:17px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink)}.tile{text-align:left;cursor:pointer}
.tile:hover{border-color:var(--acc)}.tile .ic{font-size:30px;display:block}.tile b{display:block;font-size:17px;margin:4px 0 2px}.tile .d{color:var(--mute);font-size:13.5px}.tile .n{display:block;margin-top:8px;font-size:13px;color:var(--acc);font-weight:600}
.auth{max-width:400px;margin:24px auto;padding:0 14px}.auth .card{padding:18px}.auth h1{text-align:center;font-size:24px;color:var(--acc);margin:0}.auth p.t{text-align:center;color:var(--mute);margin:4px 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;cursor:pointer}.tabs button.on{background:var(--bg);color:var(--acc);font-weight:600}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px;margin-bottom:10px}label.c{flex-direction:row;align-items:center;gap:8px}label.c input{width:auto}
.err{color:var(--bad);font-size:14px;margin:0 0 10px}.ok{color:var(--ok);font-size:14px;margin:0 0 10px}.note{color:var(--mute);font-size:12.5px;margin-top:14px}
@media (max-width:720px){.menu{display:inline-block}aside{position:absolute;z-index:10;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.25)}aside.open{transform:none}}
</style>
</head>

<script>
const SECS=[{"id": "stock", "icon": "\ud83d\udc8a", "name": "PharmaStock", "desc": "Helps pharmacies and businesses manage inventory and expiry dates."}, {"id": "qms", "icon": "\ud83e\uddea", "name": "PharmaQMS", "desc": "Helps pharmaceutical companies organize GMP documentation and quality records."}, {"id": "phyto", "icon": "\ud83c\udf3f", "name": "PhytoResearch", "desc": "Helps researchers investigate medicinal plants and their chemical compounds."}, {"id": "analytics", "icon": "\ud83d\udcca", "name": "PharmaAnalytics", "desc": "Analyzes pharmaceutical data and generates reports."}, {"id": "lab", "icon": "\ud83d\udd2c", "name": "PharmaLab", "desc": "Helps laboratories manage samples and research data."}],PAGES={"stock": "<!DOCTYPE html>\n<html lang=\"en\">\n<head><script>window.claude={use:async function(n){var P=window.parent.PT;if(!P)throw new Error(\"no host\");if(n===\"user\")return{id:async function(){return P.user.id},profiles:async function(ids){var o={};ids.forEach(function(i){o[i]={name:(P.people&&P.people[i])||(String(i)===String(P.user.id)?P.user.name:\"\")||\"User\"}});return o}};if(n!==\"db\")throw new Error(\"unsupported\");return{doc:function(){return{get:async function(){var d=P.state[\"stock\"];return{exists:d!==undefined,data:function(){return d}}},set:async function(d){P.state[\"stock\"]=d;P.save();return d},onSnapshot:function(cb){var d=P.state[\"stock\"];setTimeout(function(){cb({exists:d!==undefined,data:function(){return d},metadata:{hasPendingWrites:false}})},0);return function(){}}}}}}};<\/script>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>PharmaStock<\/title>\n<style>\n:root{--bg:#f3f6f6;--card:#fff;--ink:#142b2b;--mute:#5d7272;--line:#dbe4e4;--acc:#0b7a75;--ok:#2e8b57;--warn:#d9822b;--y:#b8981a;--bad:#c63d3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f1b1b;--card:#162626;--ink:#e6f0ef;--mute:#8fa8a6;--line:#264040;--acc:#3cc4bc;--ok:#5cc58a;--warn:#f0a24f;--y:#d6b52b;--bad:#ee6b6b}}\n:root[data-theme=\"dark\"]{--bg:#0f1b1b;--card:#162626;--ink:#e6f0ef;--mute:#8fa8a6;--line:#264040;--acc:#3cc4bc;--ok:#5cc58a;--warn:#f0a24f;--y:#d6b52b;--bad:#ee6b6b}\nhtml{color-scheme:light dark}*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 \"Segoe UI\",system-ui,sans-serif}\nheader{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;font-weight:600;font-size:17px;color:var(--acc)}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:6}\nmain{max-width:520px;margin:0 auto;padding:14px 14px 96px}\nh2{font-size:16px;margin:18px 0 8px}.sub{color:var(--mute);font-size:13px;margin:0 0 10px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}\n.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.kp .card{margin:0}.k{font-size:24px;font-weight:600}.l{font-size:12px;color:var(--mute)}\n.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}\n.n{font-size:14.5px}.s{font-size:12px;color:var(--mute)}\n.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:8px;white-space:nowrap}\n.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}.y{color:var(--y);background:color-mix(in srgb,var(--y) 16%,transparent)}.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}\n.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}\nlabel{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px;margin-bottom:10px}\ninput,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}\n.btn{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;cursor:pointer}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}\n.sm{width:auto;padding:5px 10px;font-size:12px}select.sm{margin-top:4px}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}\n.msg{font-size:14px;margin-top:10px}\nnav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}\nnav button{border:0;background:transparent;width:auto;flex:1;padding:6px 2px;font-size:11.5px;color:var(--mute);cursor:pointer}\nnav button.on{color:var(--acc);font-weight:600}nav b{display:block;font-size:20px;line-height:1.1}\n<\/style>\n<\/head>\n<body>\n<header>PharmaStock <span id=\"st\" style=\"font-weight:400;font-size:12px;color:var(--mute)\"><\/span><\/header>\n<main id=\"v\"><\/main>\n<nav>\n<button data-t=\"home\" onclick=\"go('home')\"><b>\u2302<\/b>Home<\/button>\n<button data-t=\"stock\" onclick=\"go('stock')\"><b>\u25a4<\/b>Stock<\/button>\n<button data-t=\"receive\" onclick=\"go('receive')\"><b>\uff0b<\/b>Receive<\/button>\n<button data-t=\"issue\" onclick=\"go('issue')\"><b>\u2197<\/b>Issue<\/button>\n<button data-t=\"alerts\" onclick=\"go('alerts')\"><b>!<\/b>Alerts<\/button>\n<\/nav>\n<script>\nconst $=s=>document.querySelector(s),DAY=864e5,today=new Date();today.setHours(0,0,0,0);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst iso=d=>new Date(+d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);\nconst ds=n=>iso(new Date(+today+n*DAY));\nconst left=b=>Math.round((new Date(b.exp+\"T00:00:00\")-today)/DAY);\nconst nm=b=>(S.items[b.code]||[b.code,\"\"])[0],un=b=>(S.items[b.code]||[\"\",\"\"])[1];\nconst norm=d=>({items:d.items||{},batches:d.batches||[],log:d.log||[]});\nlet S=norm({}),ref=null,cur=\"home\",sel=\"\";\nconst live=c=>S.batches.filter(b=>b.code==c&&b.qty>0&&left(b)>=0&&(b.st||\"ok\")==\"ok\").sort((a,b)=>a.exp<b.exp?-1:1);\nconst ST={ok:\"Available\",quarantine:\"Quarantine\",recalled:\"Recalled\"};\nconst daily=n=>{const s=Date.now()-30*DAY;return S.log.filter(x=>!x.type&&x.name==n&&new Date(x.ts)>=s).reduce((a,x)=>a+x.q,0)/30};\nfunction risks(){const o=[];Object.entries(S.items).forEach(([c,v])=>{const d=daily(v[0]);if(!d)return;let cum=0;live(c).forEach(b=>{const l=left(b),un=Math.floor(b.qty-Math.max(0,d*l-cum));cum+=b.qty;if(un>=1&&l<=180)o.push({b,un})})});return o}\nfunction lows(){return Object.entries(S.items).filter(([c,v])=>v[3]>0).map(([c,v])=>{const tot=live(c).reduce((a,b)=>a+b.qty,0),d=daily(v[0]);return{n:v[0],u:v[1],tot,r:v[3],sug:Math.max(Math.ceil(d*30),v[3]*2)-tot}}).filter(x=>x.tot<=x.r)}\nconst act=()=>S.batches.filter(b=>b.qty>0).sort((a,b)=>a.exp<b.exp?-1:1);\nconst pill=d=>{const c=d<0?[\"bad\",\"Expired\"]:d<=30?[\"warn\",d+\" days\"]:d<=90?[\"y\",d+\" days\"]:[\"ok\",d+\" days\"];return `<span class=\"pill ${c[0]}\">${c[1]}<\/span>`};\nconst sp=b=>(b.st&&b.st!=\"ok\")?`<span class=\"pill ${b.st==\"recalled\"?\"bad\":\"warn\"}\">${ST[b.st]}<\/span> `:\"\";\nconst row=(b,x=\"\")=>{const l2=[b.mfg?\"Mfg \"+b.mfg:\"\",b.sup,(S.items[b.code]||[])[2]].filter(Boolean).map(esc).join(\" \u00b7 \");return `<div class=\"row\"><div><div class=\"n\">${esc(nm(b))}<\/div><div class=\"s\">${esc(b.batch)} \u00b7 ${b.qty.toLocaleString()} ${esc(un(b))} \u00b7 ${esc(b.loc||\"No location\")}<\/div>${l2?`<div class=\"s\">${l2}<\/div>`:\"\"}<\/div><div style=\"text-align:right\">${sp(b)}${x||pill(left(b))}<\/div><\/div>`};\nconst when=t=>new Date(t).toLocaleString(\"en-GB\",{day:\"2-digit\",month:\"short\",hour:\"2-digit\",minute:\"2-digit\"});\nconst logRow=x=>`<div class=\"row\"><div><div class=\"n\">${esc(x.name)}<\/div><div class=\"s\">${esc(x.batch)} \u00b7 ${x.q.toLocaleString()} \u00b7 ${when(x.ts)}<\/div><\/div><div style=\"text-align:right\">${x.flag?'<span class=\"pill warn\">Unusual<\/span> ':\"\"}<span class=\"pill ${x.type==\"receive\"?\"ok\":x.type?\"y\":x.fefo?\"ok\":\"bad\"}\">${x.type==\"receive\"?\"Received\":x.type==\"writeoff\"?\"Written off\":x.type==\"status\"?esc(x.note):x.fefo?\"FEFO\":\"Not FEFO\"}<\/span><\/div><\/div>`;\nfunction say(el,t,bad){el.style.color=bad?\"var(--bad)\":\"var(--ok)\";el.textContent=t}\nasync function save(){\n if(ref){try{await ref.set(S);$(\"#st\").textContent=\"Saved\"}catch(e){$(\"#st\").textContent=e.code==\"invalid_argument\"?\"View-only\":\"Save failed\"}}\n else{try{localStorage.setItem(\"pharmastock\",JSON.stringify(S));$(\"#st\").textContent=\"Saved on this device\"}catch(e){}}\n}\nfunction go(t){cur=t;draw()}\nconst scr={\nhome(){\n const a=act(),soon=a.filter(b=>left(b)>=0&&left(b)<=30).length,exp=a.filter(b=>left(b)<0).length,iss=S.log.filter(x=>!x.type),rate=iss.length?Math.round(iss.filter(x=>x.fefo).length/iss.length*100)+\"%\":\"None yet\";\n const near=a.filter(b=>left(b)>=0&&left(b)<=90).slice(0,5);\n return (S.batches.length?\"\":`<div class=\"card\"><h2 style=\"margin-top:0\">No stock yet<\/h2><p class=\"sub\">Receive your first batch to get started.<\/p><button class=\"btn\" onclick=\"go('receive')\">Receive first batch<\/button><\/div>`)+\n `<div class=\"kp\"><div class=\"card\"><div class=\"k\">${a.length}<\/div><div class=\"l\">Batches in stock<\/div><\/div><div class=\"card\"><div class=\"k\" style=\"color:var(--warn)\">${soon}<\/div><div class=\"l\">Expiring in 30 days<\/div><\/div><div class=\"card\"><div class=\"k\" style=\"color:var(--bad)\">${exp}<\/div><div class=\"l\">Expired<\/div><\/div><div class=\"card\"><div class=\"k\" style=\"color:var(--ok)\">${rate}<\/div><div class=\"l\">FEFO compliance<\/div><\/div><\/div>\n ${(()=>{const n=S.batches.f tpsa:+tpsa.toFixed(1)};\\n}\\nfunction fingerprint(P){\\n const{at,nb}=P,bits=new Set(),sym=k=>at[k].el+(at[k].ar?\\\"a\\\":\\\"\\\"),hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)%1024};\\n const walk=(path,str)=>{const k=path[path.length-1],rev=str.split(\\\"|\\\").reverse().join(\\\"|\\\");bits.add(hash(str<rev?str:rev));if(path.length>=6)return;\\n  nb[k].forEach(x=>{if(!path.includes(x.j))walk(path.concat(x.j),str+\\\"|\\\"+x.o+\\\"|\\\"+sym(x.j))})};\\n at.forEach((_,k)=>walk([k],sym(k)));return[...bits].sort((a,b)=>a-b);\\n}\\nconst tani=(a,b)=>{const B=new Set(b);let n=0;a.forEach(x=>{if(B.has(x))n++});return n/(a.length+b.length-n||1)};\\n\\nif(typeof module!==\\\"undefined\\\"){var __core={parse,analyze,fingerprint,tani}}\\nconst $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>\\\"]/g,c=>({\\\"&\\\":\\\"&amp;\\\",\\\"<\\\":\\\"&lt;\\\",\\\">\\\":\\\"&gt;\\\",'\\\"':\\\"&quot;\\\"}[c]));\\nconst DN=[\\\"Molecular weight\\\",\\\"H-bond donors\\\",\\\"H-bond acceptors\\\",\\\"Rotatable bonds\\\",\\\"Rings\\\",\\\"Heavy atoms\\\",\\\"TPSA (approx.)\\\",\\\"Aromatic atoms\\\",\\\"Halogens\\\",\\\"Heteroatoms\\\"];\\nfunction desc(P){const a=analyze(P);return[a.mw,a.hbd,a.hba,a.rot,a.rings,a.heavy,a.tpsa,P.at.filter(x=>x.ar).length,P.at.filter(x=>[\\\"F\\\",\\\"Cl\\\",\\\"Br\\\",\\\"I\\\"].includes(x.el)).length,P.at.filter(x=>x.el!==\\\"C\\\").length]}\\nfunction rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\\nfunction shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\\nconst mean=a=>a.reduce((s,v)=>s+v,0)/a.length,f2=v=>v.toFixed(2);\\nfunction readData(txt,unit){\\n const rows=[],bad=[];\\n txt.split(/\\\\r?\\\\n/).forEach((ln,i)=>{ln=ln.trim();if(!ln||ln[0]===\\\"#\\\")return;const p=ln.split(/[\\\\t,; ]+/),v=parseFloat(p[p.l "The shuffled-activity control scored R2 \\\"+f2(A.yr)+\\\" instead of about 0. Something is leaking or the set is too small for this test to mean much.\\\");\\n if(A.S&&A.S.ridge.r2<A.R.r2-0.3)w.push(\\\"The model got much worse on the heaviest compounds it never saw (R2 \\\"+f2(A.S.ridge.r2)+\\\"). It does not extrapolate beyond its training range.\\\");\\n if(d.dups)w.push(d.dups+\\\" duplicate structure(s) were merged by averaging their activity.\\\");\\n if(!w.length)w.push(\\\"No red flags from these checks. That does not prove the model will work on new chemistry; confirm with experiments.\\\");\\n const row=(n,m)=>'<tr><td>'+n+'<\\/td><td>'+f2(m.r2)+'<\\/td><td>'+f2(m.rmse)+'<\\/td><td>'+f2(m.mae)+'<\\/td><\\/tr>';\\n $(\\\"#out\\\").innerHTML=\\n '<div class=\\\"card\\\"><h2>Data check<\\/h2><p class=\\\"sub\\\">'+rows.length+' unique compounds read. Activity range '+f2(Math.min(...ys))+' to '+f2(Math.max(...ys))+' (pIC50 scale).'+(d.bad.length?' '+d.bad.length+' line(s) skipped.':'')+'<\\/p>'+(d.bad.length?'<ul class=\\\"sub\\\">'+d.bad.slice(0,3).map(b=>'<li>'+esc(b)+'<\\/li>').join('')+'<\\/ul>':'')+'<\\/div>'+\\n '<div class=\\\"card\\\"><h2>5-fold cross-validation<\\/h2><table><tr><th>Model<\\/th><th>R2<\\/th><th>RMSE<\\/th><th>MAE<\\/th><\\/tr>'+row(\\\"Predict the average\\\",A.B)+row(\\\"Ridge on descriptors\\\",A.R)+row(\\\"Nearest neighbours (fingerprint)\\\",A.N)+'<\\/table><p class=\\\"sub\\\">Each compound is predicted by a model that never saw it. RMSE and MAE are in pIC50 units.<\\/p><div class=\\\"svg\\\">'+scatter(A.cvp)+'<\\/div><\\/div>'+\\n '<div class=\\\"card\\\"><h2>Reality checks<\\/h2><table><tr><th>Check<\\/th><th>R2<\\/th><th>RMSE<\\/th><\\/tr><tr><td>Training fit (ridge)<\\/td><td>'+f2(A.T.r2)+'<\\/td><td>'+f2(A.T.rmse)+'<\\/td><\\/tr><tr><td>Shuffled activities (should be near 0)<\\/td><td>'+f2(A.yr)+'<\\/td><td><\\/td><\\/tr>'+(A.S?'<tr><td>Heaviest '+A.S.n+' compounds held out (ridge)<\\/td><td>'+f2(A.S.ridge.r2)+'<\\/td><td>'+f2(A.S.ridge.rmse)+'<\\/td><\\/tr><tr><td>Same test, nearest neighbours<\\/td><td>'+f2(A.S.knn.r2)+'<\\/td><td>'+f2(A.S.knn.rmse)+'<\\/td><\\/tr>':'')+'<\\/table><\\/div>'+\\n '<div class=\\\"card\\\"><h2>What to conclude<\\/h2><ul>'+w.map(x=>'<li>'+esc(x)+'<\\/li>').join('')+'<\\/ul><\\/div>'+\\n '<div class=\\\"card\\\"><h2>Descriptors most correlated with activity<\\/h2><table><tr><th>Descriptor<\\/th><th>Pearson r<\\/th><\\/tr>'+A.cors.slice(0,5).map(c=>'<tr><td>'+c.n+'<\\/td><td>'+f2(c.r)+'<\\/td><\\/tr>').join('')+'<\\/table><p class=\\\"sub\\\">Correlation is not causation, and it only describes this dataset.<\\/p><\\/div>'+\\n '<div class=\\\"card\\\"><h2>Predict a new compound<\\/h2><label>SMILES<input id=\\\"pq\\\" placeholder=\\\"e.g. Oc1ccc(Cl)cc1\\\" autocapitalize=\\\"off\\\"><\\/label><button id=\\\"pb\\\">Predict<\\/button><div id=\\\"pr\\\"><\\/div><\\/div>';\\n $(\\\"#pb\\\").onclick=predict;$(\\\"#pq\\\").addEventListener(\\\"keydown\\\",e=>{if(e.key===\\\"Enter\\\")predict()});\\n}\\nfunction predict(){\\n try{\\n  const s=$(\\\"#pq\\\").value.trim(),P=parse(s),x=desc(P),fp=fingerprint(P),rp=ridgeP(MODEL.ridge,x),k=knnP(MODEL.rows,fp),ms=k.nn[0].t;\\n  const out=DN.filter((_,j)=>x[j]<MODEL.mn[j]-1e-9||x[j]>MODEL.mx[j]+1e-9),inDom=ms>=0.4&&!out.length;\\n  $(\\\"#pr\\\").innerHTML='<table><tr><td>Ridge prediction<\\/td><td>'+f2(rp)+'<\\/td><\\/tr><tr><td>Nearest-neighbour prediction<\\/td><td>'+f2(k.p)+'<\\/td><\\/tr><\\/table>'+\\n  '<p class=\\\"'+(inDom?'ok':'bad')+'\\\">'+(inDom?'Inside the training domain.':'Outside the training domain: treat these numbers as unreliable.')+'<\\/p><ul class=\\\"sub\\\">'+\\n  '<li>Closest training compound: similarity '+f2(ms)+' (below 0.40 is a weak neighbour).<\\/li>'+(out.length?'<li>Outside the training range for: '+out.join(\\\", \\\")+'.<\\/li>':'')+\\n  (Math.abs(rp-k.p)>0.7?'<li>The two models disagree by '+f2(Math.abs(rp-k.p))+', a sign of high uncertainty.<\\/li>':'')+'<\\/ul>'+\\n  '<p class=\\\"sub\\\">Closest compounds:<\\/p><table>'+k.nn.map(n=>'<tr><td>'+esc(n.smi)+'<\\/td><td>'+f2(n.t)+'<\\/td><td>'+f2(n.y)+'<\\/td><\\/tr>').join('')+'<\\/table>';\\n }catch(e){$(\\\"#pr\\\").innerHTML='<p class=\\\"bad\\\">'+esc(e.message)+'<\\/p>'}\\n}\\n$(\\\"#run\\\").onclick=run;\\nif($(\\\"#demo\\\"))$(\\\"#demo\\\").onclick=()=>{$(\\\"#d\\\").value=\\\"# SYNTHETIC DEMO: activities come from a formula plus random noise, not from experiments.\\\\n\\\"+demoData();$(\\\"#u\\\").value=\\\"p\\\";$(\\\"#out\\\").innerHTML='<div class=\\\"banner\\\">Synthetic demo data. These activities were generated by a formula plus noise, so they are not real measurements. Tap Train and evaluate to see the workflow.<\\/div>'};\\nif(typeof module!==\\\"undefined\\\")module.exports={readData,analyzeData,demoData,predictSet};\\n<\\/script>\\n<\\/body>\\n<\\/html>\\n\";\nconst P=parent.PT,S=P.state,$=s=>document.querySelector(s),esc=s=>String(s==null?\"\":s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst today=new Date();today.setHours(0,0,0,0);\nconst dleft=e=>e?Math.round((new Date(e+\"T00:00:00\")-today)/864e5):9999;\nconst DONE={sop:[\"Obsolete\"],trn:[\"Completed\"],dev:[\"Closed\"],capa:[\"Closed\"],chg:[\"Implemented\",\"Rejected\"],eqp:[\"Retired\"],sup:[\"Disqualified\"],aud:[\"Closed\"],cmp:[\"Closed\"],rsk:[\"Closed\"],br:[\"Released\",\"Rejected\"]};\nconst MN={sop:\"SOPs and documents\",trn:\"Training records\",dev:\"Deviations\",capa:\"CAPA\",chg:\"Change control\",eqp:\"Equipment calibration\",sup:\"Supplier qualification\",aud:\"Audits\",cmp:\"Complaints\",rsk:\"Risk assessments\",br:\"Batch records\"};\nconst bar=(parts)=>{const t=parts.reduce((a,p)=>a+p[1],0)||1;return `<div class=\"bar\">${parts.map(p=>`<i style=\"flex:${p[1]};background:${p[2]}\"><\/i>`).join(\"\")}<\/div><div class=\"leg\">${parts.map(p=>`<span><b style=\"background:${p[2]}\"><\/b>${p[0]}: ${p[1]}<\/span>`).join(\"\")}<\/div>`};\nfunction data(){\n const st=S.stock||{items:{},batches:[],log:[]},b=st.batches.filter(x=>x.qty>0),it=st.items||{};\n const exp=b.filter(x=>dleft(x.exp)<0),s30=b.filter(x=>dleft(x.exp)>=0&&dleft(x.exp)<=30),s90=b.filter(x=>dleft(x.exp)>30&&dleft(x.exp)<=90),ok=b.length-exp.length-s30.length-s90.length;\n const iss=(st.log||[]).filter(x=>!x.type),fefo=iss.length?Math.round(iss.filter(x=>x.fefo).length/iss.length*100):null;\n const low=Object.entries(it).filter(([c,v])=>v[3]>0&&st.batches.filter(x=>x.code===c&&x.qty>0&&dleft(x.exp)>=0&&(x.st||\"ok\")===\"ok\").reduce((a,x)=>a+x.qty,0)<=v[3]).map(([c,v])=>v[0]);\n const recs=(S.qms||{recs:[]}).recs,open=recs.filter(r=>!(DONE[r.m]||[]).includes(r.st)),over=open.filter(r=>r.f.due&&dleft(r.f.due)<0);\n const samples=(S.lab||{samples:[]}).samples,lo=samples.filter(r=>r.st!==\"Reported\"&&r.due&&dleft(r.due)<0),oos=samples.filter(r=>(r.tests||[]).some(t=>t.res===\"OOS\"));\n const ph=S.phyto||{plants:[],cmps:[]};\n return{st,it,b,exp,s30,s90,ok,fefo,low,recs,open,over,samples,lo,oos,ph};\n}\nfunction overview(){\n const d=data(),att=[];\n d.exp.forEach(x=>att.push([\"Stock\",\"Expired: \"+((d.it[x.code]||[x.code])[0])+\" batch \"+x.batch]));\n d.s30.forEach(x=>att.push([\"Stock\",\"Expires in \"+dleft(x.exp)+\" days: \"+((d.it[x.code]||[x.code])[0])+\" batch \"+x.batch]));\n d.low.forEach(n=>att.push([\"Stock\",\"At or below reorder level: \"+n]));\n d.over.forEach(r=>att.push([\"Quality\",\"Overdue \"+(MN[r.m]||r.m)+\": \"+r.id+\" \"+(r.f.title||\"\")]));\n d.lo.forEach(r=>att.push([\"Lab\",\"Overdue sample \"+r.id+\": \"+r.name]));\n d.oos.forEach(r=>att.push([\"Lab\",\"Out-of-spec result in \"+r.id+\": \"+r.name]));\n const mods=Object.keys(MN).map(m=>{const l=d.recs.filter(r=>r.m===m),o=l.filter(r=>!DONE[m].includes(r.st));return[MN[m],l.length,o.length,o.filter(r=>r.f.due&&dleft(r.f.due)<0).length]}).filter(r=>r[1]);\n const stc={};d.samples.forEach(r=>stc[r.st]=(stc[r.st]||0)+1);\n const empty=!d.b.length&&!d.recs.length&&!d.samples.length&&!d.ph.plants.length&&!d.ph.cmps.length;\n return `${empty?'<div class=\"card big\"><p class=\"sub\" style=\"margin:0\">No records yet. Add data in the other sections and this report fills in automatically.<\/p><\/div>':\"\"}\n <div class=\"noprint\"><button class=\"g\" id=\"pr\">Print or save as PDF<\/button><button class=\"g\" data-csv=\"stock\">Stock CSV<\/button><button class=\"g\" data-csv=\"qms\">Quality records CSV<\/button><button class=\"g\" data-csv=\"lab\">Lab samples CSV<\/button><button class=\"g\" data-csv=\"phyto\">Plants and compounds CSV<\/button><\/div>\n <div class=\"grid\"><div class=\"card\"><div class=\"l\">PharmaStock<\/div><div class=\"k\">${d.b.length}<\/div><div class=\"l\">batches in stock<\/div><div class=\"l\" style=\"margin-top:6px\">${d.exp.length} expired \u00b7 ${d.s30.length} expiring in 30 days \u00b7 ${d.low.length} low stock<\/div><\/div>\n <div class=\"card\"><div class=\"l\">PharmaQMS<\/div><div class=\"k\">${d.open.length}<\/div><div class=\"l\">open quality records<\/div><div class=\"l\" style=\"margin-top:6px\">${d.over.length} overdue<\/div><\/div>\n <div class=\"card\"><div class=\"l\">PharmaLab<\/div><div class=\"k\">${d.samples.filter(r=>r.st!==\"Reported\").length}<\/div><div class=\"l\">samples in progress<\/div><div class=\"l\" style=\"margin-top:6px\">${d.lo.length} overdue \u00b7 ${d.oos.length} with OOS results<\/div><\/div>\n <div class=\"card\"><div class=\"l\">PhytoResearch<\/div><div class=\"k\">${d.ph.plants.length}<\/div><div class=\"l\">plants recorded<\/div><div class=\"l\" style=\"margin-top:6px\">${d.ph.cmps.length} compounds<\/div><\/div><\/div>\n <div class=\"card big\"><h2>Needs attention (${att.length})<\/h2>${att.length?att.slice(0,15).map(a=>`<div class=\"row\"><span>${esc(a[1])}<\/span><span>${a[0]}<\/span><\/div>`).join(\"\")+(att.length>15?`<p class=\"sub\">And ${att.length-15} more.<\/p>`:\"\"):'<p class=\"sub\" style=\"margin:0\">Nothing needs attention right now.<\/p>'}<\/div>\n <div class=\ }
const cnt=()=>{const S=PT.state,t=new Date();t.setHours(0,0,0,0);const dl=e=>e?Math.round((new Date(e+"T00:00:00")-t)/864e5):9999;
 const b=((S.stock||{}).batches||[]).filter(x=>x.qty>0),r=((S.qms||{}).recs||[]),l=((S.lab||{}).samples||[]),ph=S.phyto||{plants:[],cmps:[]};
 return{stock:[b.length,"batches in stock · "+b.filter(x=>dl(x.exp)>=0&&dl(x.exp)<=30).length+" expiring soon"],qms:[r.length,"quality records"],phyto:[ph.plants.length,"plants · "+ph.cmps.length+" compounds"],analytics:[null,"Reports and model builder"],lab:[l.length,"samples · "+l.filter(x=>x.st!=="Reported").length+" in progress"]}};
function dash(){
 const c=cnt();
 $("#dash").innerHTML=`<div class="hero"><h1>Welcome${PT.user?", "+esc(PT.user.name.split(" ")[0]):""}!</h1><p>${PT.user&&PT.user.org?esc(PT.user.org)+" · ":""}Your PharmaTech dashboard</p></div>${PT.user&&PT.user.role==="viewer"?'<p class="note" style="text-align:center">You have view-only access. You can look at records, but changes are not saved.</p>':""}<h2 style="text-align:center">Choose a section</h2><div class="grid">${SECS.filter(s=>allowed(s.id)).map(s=>`<button class="tile" data-s="${s.id}"><span class="ic">${s.icon}</span><b>${s.name}</b><span class="d">${s.desc}</span><span class="n">${c[s.id][0]===null?c[s.id][1]:c[s.id][0]+" "+c[s.id][1]}</span></button>`).join("")}</div><p class="note" style="text-align:center">Demonstration tools. Not validated systems, and not for regulated use.</p>`;
}
function acct(msg){
 $("#dash").innerHTML=`<div class="card"><h2 style="margin-top:0">Account</h2><p>${esc(PT.user.name)}<br><span style="color:var(--mute)">${esc(PT.user.email)}${PT.user.org?" · "+esc(PT.user.org):""}</span></p></div><div class="card" style="margin-top:12px"><h2 style="margin-top:0">Change password</h2>${msg?`<p class="${msg.e?"err":"ok"}">${esc(msg.t)}</p>`:""}<form id="pf"><label>Current password<input name="o" type="password" required autocomplete="current-password"></label><label>New password (at least 8 characters)<input name="n" type="password" required minlength="8" autocomplete="new-password"></label><button class="btn">Change password</button></form></div>`;
}
const SN=Object.fromEntries(SECS.map(s=>[s.id,s.name]));
async function open_(id){
 cur=id;side();$("#side").classList.remove("open");
 const page=id==="home"||id==="acct"||id==="team"||id==="audit";
 $("#dash").style.display=page?"block":"none";
 Object.keys(frames).forEach(k=>frames[k].style.display=k===id?"block":"none");
 const s=SECS.find(x=>x.id===id);$("#cur").textContent=id==="acct"?"· Account":id==="team"?"· Team":id==="audit"?"· Audit trail":s?"· "+s.name:"";
 if(id==="home"){await syncAll();if(cur===id)dash()}else if(id==="acct")acct();else if(id==="team")await team();else if(id==="audit")await auditPage();
 else{
  await sync(id);if(cur!==id)return;
  if(!frames[id]){const f=document.createElement("iframe");f.title=s.name;f.srcdoc=PAGES[id];$("#stage").appendChild(f);frames[id]=f}
  frames[id].style.display="block";
 }
}
let AF={section:"",q:""},AUD=[],VF=null;
async function auditPage(){
 try{AUD=await api("audit?section="+encodeURIComponent(AF.section)+"&q="+encodeURIComponent(AF.q))}catch(e){$("#dash").innerHTML='<div class="card"><p class="err">'+esc(e.message)+"</p></div>";return}
 const own=PT.user.role==="owner",th=h=>`<th style="text-align:left;padding:8px;color:var(--mute)">${h}</th>`,td=c=>`<td style="padding:8px;border-top:1px solid var(--line);vertical-align:top">${esc(c)}</td>`;
 $("#dash").innerHTML=`<div class="card"><h2 style="margin-top:0">Audit trail</h2><p class="note" style="margin:0 0 10px">Every change is recorded by the server with the person's name and the time. Entries cannot be edited or deleted in the app, and each one is linked to the one before it so tampering can be detected.</p><form id="af2" style="display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end"><label>Section<select name="section"><option value="">All</option>${KEYS.filter(allowed).map(k=>`<option value="${k}"${AF.section===k?" selected":""}>${SN[k]}</option>`).join("")}${own?`<option value="account"${AF.section==="account"?" selected":""}>Accounts and team</option>`:""}</select></label><label>Search<input name="q" value="${esc(AF.q)}" placeholder="Person, record or change"></label><button class="btn">Filter</button></form><div style="margin-top:10px"><button class="sm" data-ax="1">Download CSV</button>${own?' <button class="sm" data-vf="1">Verify integrity</button>':""}</div>${VF?`<p class="${VF.ok?"ok":"err"}" style="margin-top:8px">${VF.ok?"Integrity check passed: "+VF.count+" entries, chain unbroken.":"Integrity check FAILED at entry "+VF.broken_at+". The records may have been altered."}</p>`:""}</div>
 <div class="card" style="margin-top:12px;padding:0"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px"><tr>${["When","Who","Section","Record","Action","Details"].map(th).join("")}</tr>${AUD.map(a=>"<tr>"+[new Date(a.at+"Z").toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}),a.who,SN[a.section]||"Accounts and team",a.record,a.action,a.detail].map(td).join("")+"</tr>").join("")||'<tr><td colspan="6" style="padding:12px;color:var(--mute)">No entries match.</td></tr>'}</table></div></div>`;
}
const secBoxes=(sel,attr)=>KEYS.map(k=>`<label class="c" style="margin:0 12px 4px 0"><input type="checkbox" ${attr}="${k}"${sel==="*"||sel.split(",").includes(k)?" checked":""}> ${SN[k]}</label>`).join("");
const secTxt=s=>s==="*"?"All sections":s.split(",").map(k=>SN[k]).join(", ");
async function team(m){
 if(m!==undefined)TMSG=m;
 try{TEAM=await api("team")}catch(e){$("#dash").innerHTML='<div class="card"><p class="err">'+esc(e.message)+"</p></div>";return}
 const me=PT.user.id;
 $("#dash").innerHTML=`${TMSG?`<p class="${TMSG.e?"err":"ok"}" role="status">${esc(TMSG.t)}</p>`:""}
 <div class="card"><h2 style="margin-top:0">Invite a colleague</h2>${LASTCODE?`<div class="card" style="margin-bottom:12px"><div class="note" style="margin:0">Send this code to your colleague. They choose Create account, tick "I have an invite code", and enter it. It works once and lasts 14 days.</div><div style="font-size:26px;font-weight:700;letter-spacing:3px;margin-top:6px">${esc(LASTCODE)}</div></div>`:""}
 <form id="inv"><label>Role<select name="role"><option value="staff">Staff (can edit)</option><option value="viewer">Viewer (read only)</option><option value="owner">Owner (manages the team)</option></select></label><div style="margin-bottom:10px"><div class="note" style="margin:0 0 4px">Sections they can open</div>${secBoxes("*","data-isec")}</div><button class="btn">Create invite code</button></form>
 ${TEAM.invites.length?`<h2>Pending invites</h2>${TEAM.invites.map(i=>`<div class="note" style="display:flex;justify-content:space-between;gap:8px;margin:6px 0"><span><b>${i.code}</b> · ${i.role} · ${secTxt(i.sections)} · expires ${i.expires}</span><button class="sm" data-rev="${i.code}">Revoke</button></div>`).join("")}`:""}</div>
 <div class="card" style="margin-top:12px"><h2 style="margin-top:0">Team members (${TEAM.members.length})</h2>${TEAM.members.map(m=>`<div style="padding:10px 0;border-top:1px solid var(--line)"><b>${esc(m.name)}</b> <span class="note" style="margin:0">${esc(m.email)}${m.active?"":" · deactivated"}</span><div style="margin:6px 0"><select data-mr="${m.id}"${m.id===me?" disabled":""}>${["owner","staff","viewer"].map(r=>`<option${m.role===r?" selected":""}>${r}</option>`).join("")}</select></div><div>${secBoxes(m.sections,'data-ms="'+m.id+'" data-k')}</div><div style="margin-top:6px"><button class="sm" data-mt="${m.id}" data-on="${m.active?1:0}"${m.id===me?" disabled":""}>${m.active?"Deactivate":"Reactivate"}</button> <button class="sm" data-mp="${m.id}" data-n="${esc(m.name)}">Set new password</button></div></div>`).join("")}</div>
 <div class="card" style="margin-top:12px"><h2 style="margin-top:0">Recent activity</h2>${TEAM.activity.length?TEAM.activity.slice(0,20).map(a=>`<div class="note" style="margin:4px 0">${new Date(a.at+"Z").toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})} · ${esc(a.who)} · ${esc(a.action)}</div>`).join(""):'<p class="note">No activity yet.</p>'}</div>`;
}
async function patchMember(id,obj){try{await api("team/member/"+id,{method:"PATCH",body:JSON.stringify(obj)});await team({t:"Saved.",e:0})}catch(e){await team({t:e.message,e:1})}}
function showApp(){
 $("#auth").hidden=true;$("#app").hidden=false;$("#lo").hidden=false;$("#menu").hidden=false;
 $("#who").textContent=PT.user.name+" · "+PT.user.role;LASTCODE="";TMSG=null;open_("home");
}
document.addEventListener("click",e=>{
 const iv=e.target.closest("[data-inv]");if(iv){FV={name:(document.querySelector('[name="name"]')||{}).value||"",email:(document.querySelector('[name="email"]')||{}).value||""};useInv=iv.checked;showAuth();return}
 const ax=e.target.closest("[data-ax]");if(ax){download("audit-trail.csv",[["When (UTC)","Who","Section","Record","Action","Details"]].concat(AUD.map(a=>[a.at,a.who,a.section,a.record,a.action,a.detail])));return}
 const vf=e.target.closest("[data-vf]");if(vf){api("audit/verify").then(v=>{VF=v;auditPage()});return}
 const rv=e.target.closest("[data-rev]");if(rv){api("team/invite/"+rv.dataset.rev,{method:"DELETE"}).then(()=>team({t:"Invite revoked.",e:0}));return}
 const mt=e.target.closest("[data-mt]");if(mt){patchMember(mt.dataset.mt,{active:mt.dataset.on!=="1"});return}
 const mp=e.target.closest("[data-mp]");if(mp){const p=prompt("New password for "+mp.dataset.n+" (at least 8 characters)");if(p)patchMember(mp.dataset.mp,{password:p});return}
 const m=e.target.closest("[data-m]");if(m){FV={};mode=m.dataset.m;amsg=null;showAuth();return}
 const t=e.target.closest("[data-s]");if(t)open_(t.dataset.s);
});
document.addEventListener("change",e=>{
 const r=e.target.dataset&&e.target.dataset.mr;if(r){patchMember(r,{role:e.target.value});return}
 const sid=e.target.dataset&&e.target.dataset.ms;
 if(sid){const sel=[...document.querySelectorAll('[data-ms="'+sid+'"]')].filter(x=>x.checked).map(x=>x.dataset.k);
  if(!sel.length){team({t:"Choose at least one section.",e:1});return}
  patchMember(sid,{sections:sel.length===KEYS.length?"*":sel.join(",")})}
});
document.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target,fd=new FormData(f),g=k=>(fd.get(k)||"").toString();
 if(f.id==="af"){
  try{
   const body=mode==="up"?{name:g("name").trim(),org:g("org").trim(),invite:g("invite").trim(),email:g("email"),password:g("password"),keep:!!fd.get("keep")}:{email:g("email"),password:g("password"),keep:!!fd.get("keep")};
   const d=await api(mode==="up"?"signup":"login",{method:"POST",body:JSON.stringify(body)});
   TOKEN=d.token;(body.keep?localStorage:sessionStorage).setItem("pttoken",TOKEN);PT.user=d.user;amsg=null;await load();showApp();
  }catch(er){amsg={t:er.message,e:1};showAuth()}
 }else if(f.id==="inv"){
  const sel=[...document.querySelectorAll("[data-isec]")].filter(x=>x.checked).map(x=>x.dataset.isec);
  if(!sel.length){team({t:"Choose at least one section.",e:1});return}
  try{const d=await api("team/invite",{method:"POST",body:JSON.stringify({role:g("role"),sections:sel.length===KEYS.length?"*":sel.join(",")})});LASTCODE=d.code;await team({t:"Invite created.",e:0})}catch(er){await team({t:er.message,e:1})}
 }else if(f.id==="af2"){AF={section:g("section"),q:g("q")};await auditPage()
 }else if(f.id==="pf"){
  try{await api("password",{method:"POST",body:JSON.stringify({old:g("o"),new:g("n")})});acct({t:"Password changed."})}catch(er){acct({t:er.message,e:1})}
 }
});
$("#lo").onclick=async()=>{try{await api("logout",{method:"POST"})}catch(e){}out();amsg=null;mode="in";showAuth()};
$("#menu").onclick=()=>$("#side").classList.toggle("open");
(async()=>{
 if(TOKEN){try{PT.user=await api("me");await load();showApp();return}catch(e){if(e.message==="signed out")return;out()}
 showAuth();
})();
</script>
</body>
</html>
